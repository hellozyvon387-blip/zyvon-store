<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZYVON — Wear Your Edge</title>

  <meta
    name="description"
    content="ZYVON — modern streetwear built for people who move differently."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================
       RESET
    ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", sans-serif;
      background: #fff;
      color: #111;
      line-height: 1.5;
    }

    body.no-scroll {
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      width: 100%;
      display: block;
    }


    /* =========================================
       VARIABLES
    ========================================= */

    :root {
      --black: #111;
      --dark: #181818;
      --gray: #777;
      --light-gray: #f4f4f4;
      --border: #dedede;
      --white: #fff;
    }


    /* =========================================
       HEADER
    ========================================= */

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 76px;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid #e8e8e8;
      z-index: 1000;
    }

    .nav {
      width: min(1400px, 92%);
      height: 100%;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1.5px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 34px;
    }

    .nav-links a {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      transition: opacity .2s;
    }

    .nav-links a:hover {
      opacity: .5;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-action {
      border: 0;
      background: transparent;
      padding: 10px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .cart-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 20px;
      height: 20px;

      margin-left: 4px;

      background: #111;
      color: white;

      border-radius: 50%;

      font-size: 9px;
    }

    .mobile-menu-btn {
      display: none;
      border: 0;
      background: none;
      font-size: 23px;
    }


    /* =========================================
       HERO
    ========================================= */

    .hero {
      min-height: 100vh;
      margin-top: 76px;

      position: relative;

      display: flex;
      align-items: flex-end;

      background:
        linear-gradient(
          to top,
          rgba(0,0,0,.72),
          rgba(0,0,0,.08)
        ),
        url("https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=2200&q=90")
        center / cover no-repeat;

      color: white;
    }

    .hero-content {
      width: min(1400px, 92%);
      margin: auto;
      padding: 100px 0 90px;
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2.5px;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: clamp(58px, 10vw, 150px);
      line-height: .84;
      letter-spacing: -7px;
      font-weight: 900;
      max-width: 1100px;
    }

    .hero-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 30px;

      margin-top: 45px;
    }

    .hero-description {
      max-width: 390px;
      font-size: 13px;
      color: #eee;
    }

    .primary-btn {
      border: 1px solid white;
      background: white;
      color: #111;

      padding: 16px 25px;

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;

      transition: .25s;
    }

    .primary-btn:hover {
      background: transparent;
      color: white;
    }


    /* =========================================
       GENERAL SECTIONS
    ========================================= */

    .section {
      width: min(1400px, 92%);
      margin: auto;
      padding: 120px 0;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;

      margin-bottom: 45px;
    }

    .section-head h2 {
      font-size: clamp(38px, 6vw, 78px);
      line-height: .9;
      letter-spacing: -4px;
      font-weight: 900;
    }

    .section-count {
      color: var(--gray);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
    }


    /* =========================================
       PRODUCT GRID
    ========================================= */

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 26px 14px;
    }

    .product-card {
      cursor: pointer;
    }

    .product-image {
      position: relative;
      overflow: hidden;
      aspect-ratio: 4 / 5;
      background: #f3f3f3;
    }

    .product-image img {
      height: 100%;
      object-fit: cover;
      transition: transform .5s ease;
    }

    .product-card:hover .product-image img {
      transform: scale(1.04);
    }

    .product-hover {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;

      padding: 15px;

      background: rgba(0,0,0,.86);
      color: white;

      text-align: center;

      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.5px;

      transform: translateY(100%);
      transition: .3s;
    }

    .product-card:hover .product-hover {
      transform: translateY(0);
    }

    .product-info {
      padding-top: 15px;

      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .product-info h3 {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .product-info p {
      margin-top: 4px;
      color: #888;

      font-size: 9px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .product-info strong {
      white-space: nowrap;
      font-size: 11px;
    }


    /* =========================================
       FILTER
    ========================================= */

    .filter-bar {
      display: flex;
      gap: 8px;

      margin-bottom: 45px;

      overflow-x: auto;
      scrollbar-width: none;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      border: 1px solid var(--border);
      background: white;

      padding: 12px 18px;

      white-space: nowrap;

      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1px;

      transition: .2s;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: #111;
      color: white;
      border-color: #111;
    }


    /* =========================================
       CATEGORIES
    ========================================= */

    .categories {
      width: min(1400px, 92%);
      margin: auto;

      padding-bottom: 120px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .category-card {
      position: relative;
      min-height: 500px;
      overflow: hidden;
      background: #ddd;
      color: white;
    }

    .category-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;

      position: absolute;
      inset: 0;

      transition: transform .6s;
    }

    .category-card:hover img {
      transform: scale(1.05);
    }

    .category-card::after {
      content: "";
      position: absolute;
      inset: 0;

      background: linear-gradient(
        to top,
        rgba(0,0,0,.65),
        transparent 65%
      );
    }

    .category-content {
      position: absolute;
      z-index: 2;

      bottom: 30px;
      left: 30px;
    }

    .category-content h3 {
      font-size: 35px;
      line-height: .9;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .category-content span {
      display: inline-block;
      margin-top: 12px;

      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }


    /* =========================================
       EDITORIAL
    ========================================= */

    .editorial {
      display: grid;
      grid-template-columns: 1fr 1fr;

      min-height: 700px;

      background: #f2f2f2;
    }

    .editorial-image {
      min-height: 600px;
    }

    .editorial-image img {
      height: 100%;
      object-fit: cover;
    }

    .editorial-content {
      display: flex;
      flex-direction: column;
      justify-content: center;

      padding: 10%;
    }

    .editorial-content h2 {
      font-size: clamp(45px, 6vw, 85px);
      line-height: .88;
      letter-spacing: -4px;
      font-weight: 900;

      margin-bottom: 35px;
    }

    .editorial-content p:not(.eyebrow) {
      max-width: 450px;

      margin-bottom: 16px;

      color: #555;

      font-size: 14px;
    }

    .outline-btn {
      width: fit-content;

      margin-top: 20px;

      padding: 15px 22px;

      background: transparent;
      border: 1px solid #111;

      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.2px;

      transition: .25s;
    }

    .outline-btn:hover {
      background: #111;
      color: white;
    }


    /* =========================================
       NEWSLETTER
    ========================================= */

    .newsletter {
      background: #111;
      color: white;
      padding: 120px 20px;
      text-align: center;
    }

    .newsletter-inner {
      width: min(700px, 100%);
      margin: auto;
    }

    .newsletter h2 {
      font-size: clamp(45px, 8vw, 95px);
      line-height: .86;
      letter-spacing: -5px;
      font-weight: 900;

      margin-bottom: 25px;
    }

    .newsletter-inner > p:not(.eyebrow) {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 35px;
    }

    #newsletterForm {
      display: flex;

      max-width: 600px;
      margin: auto;
    }

    #newsletterEmail {
      flex: 1;

      min-width: 0;

      padding: 17px 18px;

      border: 1px solid #444;
      background: #1b1b1b;
      color: white;

      outline: none;

      font-size: 10px;
      letter-spacing: 1px;
    }

    #newsletterForm button {
      padding: 0 28px;

      border: 1px solid white;
      background: white;
      color: #111;

      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .newsletter small {
      display: block;
      margin-top: 15px;

      color: #666;
      font-size: 9px;
    }


    /* =========================================
       FOOTER
    ========================================= */

    .footer {
      background: #111;
      color: white;

      padding: 70px 4% 25px;

      border-top: 1px solid #333;
    }

    .footer-main {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 40px;

      max-width: 1400px;
      margin: auto;
    }

    .footer-logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .footer-brand p {
      margin-top: 10px;

      color: #777;

      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .footer-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .footer-column h4 {
      margin-bottom: 8px;

      font-size: 9px;
      color: #777;
      letter-spacing: 1.5px;
    }

    .footer-column a {
      font-size: 10px;
      font-weight: 600;
    }

    .footer-column a:hover {
      color: #888;
    }

    .footer-bottom {
      max-width: 1400px;
      margin: 70px auto 0;

      padding-top: 20px;

      border-top: 1px solid #292929;

      display: flex;
      justify-content: space-between;

      color: #555;

      font-size: 8px;
      font-weight: 700;
      letter-spacing: 1px;
    }


    /* =========================================
       SEARCH
    ========================================= */

    .search-overlay {
      position: fixed;
      inset: 0;

      background: rgba(255,255,255,.98);

      z-index: 2000;

      opacity: 0;
      visibility: hidden;

      transition: .25s;
    }

    .search-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .search-container {
      width: min(900px, 90%);
      margin: 16vh auto 0;
    }

    .search-container input {
      width: 100%;

      border: 0;
      border-bottom: 2px solid #111;

      padding: 20px 0;

      outline: none;

      font-size: clamp(30px, 5vw, 60px);
      font-weight: 800;
      letter-spacing: -2px;
    }

    .search-close {
      position: absolute;
      top: 30px;
      right: 4%;

      border: 0;
      background: none;

      font-size: 35px;
      font-weight: 300;
    }

    #searchResults {
      margin-top: 25px;
    }

    .search-result {
      display: flex;
      align-items: center;
      gap: 15px;

      padding: 12px 0;

      border-bottom: 1px solid #eee;

      cursor: pointer;
    }

    .search-result img {
      width: 65px;
      height: 75px;
      object-fit: cover;
    }

    .search-result h4 {
      font-size: 11px;
    }

    .search-result p {
      margin-top: 4px;
      color: #777;
      font-size: 10px;
    }

    .search-empty {
      color: #777;
      font-size: 11px;
    }


    /* =========================================
       PRODUCT MODAL
    ========================================= */

    .product-modal {
      position: fixed;
      inset: 0;

      z-index: 2100;

      display: flex;
      align-items: center;
      justify-content: center;

      opacity: 0;
      visibility: hidden;

      transition: .25s;
    }

    .product-modal.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;

      background: rgba(0,0,0,.65);
    }

    .modal-content {
      position: relative;
      z-index: 2;

      width: min(950px, 92%);
      max-height: 90vh;

      overflow: auto;

      background: white;

      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .modal-image {
      min-height: 600px;
      background: #eee;
    }

    .modal-image img {
      height: 100%;
      object-fit: cover;
    }

    .modal-info {
      padding: 55px 45px;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .modal-info h2 {
      font-size: 38px;
      line-height: .95;
      letter-spacing: -2px;
      margin-bottom: 15px;
    }

    .modal-price {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .modal-description {
      color: #666;
      font-size: 12px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .size-title {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .sizes {
      display: flex;
      gap: 7px;
      margin-bottom: 25px;
    }

    .sizes button {
      width: 43px;
      height: 43px;

      border: 1px solid #ddd;
      background: white;

      font-size: 10px;
      font-weight: 700;
    }

    .sizes button.selected {
      background: #111;
      color: white;
      border-color: #111;
    }

    .add-cart-btn {
      width: 100%;

      padding: 17px;

      background: #111;
      color: white;

      border: 0;

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .modal-close {
      position: absolute;
      z-index: 5;

      top: 15px;
      right: 15px;

      width: 35px;
      height: 35px;

      border: 0;
      background: white;

      border-radius: 50%;

      font-size: 22px;
    }


    /* =========================================
       CART
    ========================================= */

    .cart-overlay {
      position: fixed;
      inset: 0;

      z-index: 2200;

      visibility: hidden;
    }

    .cart-overlay.active {
      visibility: visible;
    }

    .cart-backdrop {
      position: absolute;
      inset: 0;

      background: rgba(0,0,0,.5);

      opacity: 0;
      transition: .25s;
    }

    .cart-overlay.active .cart-backdrop {
      opacity: 1;
    }

    .cart-drawer {
      position: absolute;
      right: 0;
      top: 0;

      width: min(450px, 100%);
      height: 100%;

      background: white;

      display: flex;
      flex-direction: column;

      transform: translateX(100%);
      transition: .3s;
    }

    .cart-overlay.active .cart-drawer {
      transform: translateX(0);
    }

    .cart-header {
      padding: 28px;

      display: flex;
      justify-content: space-between;

      border-bottom: 1px solid #eee;
    }

    .cart-header h2 {
      font-size: 25px;
      letter-spacing: -1px;
    }

    .cart-close {
      border: 0;
      background: none;
      font-size: 28px;
    }

    .cart-items {
      flex: 1;

      overflow-y: auto;

      padding: 20px 28px;
    }

    .cart-item {
      display: flex;
      gap: 15px;

      padding: 15px 0;

      border-bottom: 1px solid #eee;
    }

    .cart-item > img {
      width: 90px;
      height: 110px;

      object-fit: cover;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-info h4 {
      font-size: 10px;
      font-weight: 800;
    }

    .cart-item-info p {
      margin: 5px 0;

      color: #888;

      font-size: 9px;
    }

    .cart-item-info strong {
      font-size: 10px;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      gap: 12px;

      margin-top: 12px;
    }

    .quantity-control button {
      width: 25px;
      height: 25px;

      border: 1px solid #ddd;
      background: white;
    }

    .quantity-control span {
      font-size: 10px;
    }

    .remove-item {
      margin-top: 10px;

      border: 0;
      background: none;

      color: #888;

      font-size: 8px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .cart-footer {
      padding: 25px 28px;

      border-top: 1px solid #eee;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;

      margin-bottom: 18px;

      font-size: 11px;
      font-weight: 800;
    }

    .checkout-btn {
      width: 100%;

      padding: 17px;

      background: #111;
      color: white;

      border: 0;

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .checkout-note {
      text-align: center;

      margin-top: 10px;

      color: #999;

      font-size: 8px;
    }

    .empty-cart {
      text-align: center;
      padding: 70px 10px;
    }

    .empty-cart p {
      margin-bottom: 20px;

      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .empty-cart button {
      padding: 12px 20px;

      border: 1px solid #111;
      background: white;

      font-size: 9px;
      font-weight: 800;
    }


    /* =========================================
       TOAST
    ========================================= */

    .toast {
      position: fixed;

      bottom: 25px;
      left: 50%;

      transform: translate(-50%, 100px);

      background: #111;
      color: white;

      padding: 13px 20px;

      z-index: 3000;

      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;

      opacity: 0;

      transition: .3s;
    }

    .toast.show {
      opacity: 1;
      transform:
